<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ショートカット表示</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    height: 100vh;
  }

  /* 問題文（中央） */
  #question {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    text-align: center;
    max-width: 80%;
    word-break: break-word;
  }

  /* 右上：進捗 */
  #progress {
    position: fixed;
    top: 10px;
    right: 15px;
    font-size: 14px;
  }

  /* ボタン共通 */
  .btn {
    position: fixed;
    bottom: 20px;
    padding: 10px 20px;
    font-size: 16px;
  }

  /* 左下 */
  #prevBtn {
    left: 20px;
  }

  /* 右下 */
  #nextBtn {
    right: 20px;
  }
</style>
</head>
<body>

<div id="progress"></div>
<div id="question">クリックで開始</div>

<button id="prevBtn" class="btn" onclick="prev()">戻る</button>
<button id="nextBtn" class="btn" onclick="next()">進む</button>

<script>
const STORAGE_KEY = "shortcut_state";

// 初期データ（実際は197件）
const shortcuts = [
  "コピー",
  "貼り付け",
  "切り取り",
  "元に戻す",
  "保存",
  "印刷",
  "全選択",
  "検索",
  "置換",
  "新規作成",
  "コピー",
  "貼り付け",
  "切り取り",
  "元に戻す",
  "保存",
  "印刷",
  "全選択",
  "検索",
  "置換",
  "新規作成",
  "コピー",
  "貼り付け",
  "切り取り",
  "元に戻す",
  "保存",
  "印刷",
  "全選択",
  "検索",
  "置換",
  "新規作成",
  "コピー",
  "貼り付け",
  "切り取り",
  "元に戻す",
  "保存",
  "印刷",
  "全選択",
  "検索",
  "置換",
  "新規作成"
];

// シャッフル
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// 状態取得 or 初期化
function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);

  if (saved) {
    return JSON.parse(saved);
  }

  // 初回のみ
  const shuffled = shuffle([...shortcuts]);

  const state = {
    order: shuffled,
    index: 0
  };

  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  return state;
}

// 状態保存
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 今日の問題取得
function getTodayQuestions() {
  const state = loadState();
  if (state.index > state.order.length - 30) {
  // リセット
    state.order = shuffle([...shortcuts]);
    state.index = 0;
  }

  const start = state.index;
  const end = Math.min(start + 30, state.order.length);

  const today = state.order.slice(start, end);

  // 次回のために更新
  state.index = end;
  saveState(state);

  return today;
}

// 状態
let questions = [];
let current = 0;

// 初期化
function start() {
  questions = getTodayQuestions();
  current = 0;
  render();
}

// 描画
function render() {
  document.getElementById("question").innerText = questions[current];
  document.getElementById("progress").innerText = `${current + 1} / ${questions.length}`;
}

// 次へ
function next() {
  if (current < questions.length - 1) {
    current++;
    render();
  }
}

// 戻る
function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

start();
</script>

</body>
</html>
