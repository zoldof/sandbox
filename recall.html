<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ショートカット表示テスト</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 100px; }
  #question { font-size: 24px; margin-bottom: 20px; }
  button { font-size: 8px; padding: 5px 10px; margin: 5px; }
</style>
</head>
<body>

<h2 id="question">クリックで開始</h2>

<div>
  <button onclick="prev()">戻る</button>
  <button onclick="next()">次へ</button>
</div>

<script>
// ========================
// データ（文字列のみ）
// ========================
const shortcuts = [
  "コピー",
  "貼り付け",
  "切り取り",
  "元に戻す",
  "保存",
  "印刷",
  "全選択",
  "検索",
  "置換",
  "新規作成"
];

// ========================
// シャッフル
// ========================
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ========================
// 問題生成
// ========================
function getTodayQuestions() {
  return shuffle([...shortcuts]).slice(0, 30);
}

// ========================
// 状態
// ========================
let questions = [];
let current = 0;

// ========================
// 初期化
// ========================
function start() {
  questions = getTodayQuestions();
  current = 0;
  render();
}

// ========================
// 描画
// ========================
function render() {
  const el = document.getElementById("question");

  if (questions.length === 0) {
    el.innerText = "データなし";
    return;
  }

  el.innerText = questions[current] +
    ` (${current + 1} / ${questions.length})`;
}

// ========================
// 次へ
// ========================
function next() {
  if (current < questions.length - 1) {
    current++;
    render();
  }
}

// ========================
// 戻る
// ========================
function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

// 初期化
start();
</script>

</body>
</html>
