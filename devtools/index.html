<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タブレット用デバッグページ</title>
  
  <!-- ---- 本番環境では削除または環境変数で無効化してください ---- -->
  <script module src="/sandbox/devtools/eruda.js"></script>
  <link rel="stylesheet" href="/sandbox/devtools/eruda.css">
  
</head>
<body>

  <h1>タブレットでのデバッグテストページ</h1>
  <p>テンプレート部分をコードに貼り付けて動作させると画面右下に Eruda のアイコンが表示され、タップでコンソール・要素検査等が利用できます。</p>

  <!-- デモ用の簡単なスクリプト -->
  <button id="testBtn">コンソールに文字を出す</button>
  <script>
    document.getElementById('testBtn').addEventListener('click', () => {
      console.log('ボタンがクリックされました！');
      alert('コンソールにログが出ました。');
    });
  </script>

</body>
</html>
