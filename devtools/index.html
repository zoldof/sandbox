<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タブレット用デバッグページ</title>
  <link rel="icon" href="/sandbox/devtools/favicon.png">
  <link rel="apple-touch-icon" href="/sandbox/devtools/favicon.png">

  <!-- Eruda ＊本番環境では削除-->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script defer>eruda.init();</script>
  <link rel="stylesheet" href="/sandbox/devtools/eruda.css">
  
</head>
<body>

  <h1>タブレットでのデバッグテストページ</h1>
  <p>このページをタブレットで開くと画面右下に Eruda のアイコンが表示され、タップでコンソール・要素検査等が利用できます。</p>

  <!-- デモ用の簡単なスクリプト -->
  <button id="testBtn">コンソールに文字を出す</button>
  <script>
    document.getElementById('testBtn').addEventListener('click', () => {
      console.log('ボタンがクリックされました！');
      alert('コンソールにログが出ました。');
    });
  </script>

</body>
</html>
