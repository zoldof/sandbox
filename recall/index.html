<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>エクセルのショートカット暗記用</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="progress"></div>
<div id="question">クリックで開始</div>

<button id="prevBtn" class="btn" onclick="prev()">戻る</button>
<button id="nextBtn" class="btn" onclick="next()">進む</button>

<!-- CSV の場所を data-csv に埋め込む -->
<div id="app" data-csv="data.csv"></div>

<!--<script type="module" src="main.js"></script>-->
  
<script type="module">
const STORAGE_KEY = "shortcut_state";
const counts = 30;
let shortcuts = [];
let questions = [];
let current = 0;
  
// CSV読込
async function loadCSV(csvPath) {
  const res = await fetch(csvPath);
  const text = await res.text();

  return text.trim().split("\n").slice(1).map(line => {
    const [answer, question] = line.split(",");
    return { answer, question };
  });
}

// 初期データ設定 
// DOM が完成したらすぐ実行
document.addEventListener("DOMContentLoaded", async () => {
  const appEl   = document.getElementById("app");
  const csvPath = appEl.dataset.csv.trim();
  const allData = await loadCSV(csvPath);
  shortcuts = allData.map(d => d.question);
  start();
});

// フィッシャー・イェーツのシャッフル
// デクリメントのデータの減少に合わせた効率的な並べ替えのアルゴリズム
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// 状態取得 or 初期化
function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);

  if (saved) {
    return JSON.parse(saved);
  }

  // 初回のみ
  const shuffled = shuffle([...shortcuts]);

  const state = {
    order: shuffled,
    index: 0
  };
  
  saveState(state);
  return state;
}

// 状態保存
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 今日の問題取得
function getTodayQuestions() {
  const state = loadState();
  if (state.index > state.order.length - counts) {
  // リセット
    state.order = shuffle([...shortcuts]);
    state.index = 0;
  }

  const start = state.index;
  const end = Math.min(start + counts, state.order.length);

  const today = state.order.slice(start, end);

  // 次回のために更新
  state.index = end;
  saveState(state);

  return today;
}

// 初期化
function start() {
  questions = getTodayQuestions();
  current = 0;
  render();
}

// 描画
function render() {
  document.getElementById("question").innerText = questions[current];
  document.getElementById("progress").innerText = `${current + 1} / ${questions.length}`;
}

// 次へ
function next() {
  if (current < questions.length - 1) {
    current++;
    render();
  }
}

// 戻る
function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

</script>

</body>
</html>
