<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アクションプロセスの暗記用</title>
  <link rel="stylesheet" href="/sandbox/recall/style.css">
</head>
<body>
  <div id="progress"></div>
  <div id="question" class="slide-container"></div>
    <select id="navSelect">
    <option value="" selected disabled hidden></option>
    <option value="/sandbox/recall/excel/function/">エクセル関数</option>
    <option value="/sandbox/recall/excel/shortcut/">エクセルショートカット</option>
    <option value="/sandbox/recall/a-process/">アクションプロセス</option>
  </select>
  <button id="answBtn" class="btn" disabled>◯</button>
  <button id="shctBtn" class="btn" hidden>◇</button>
  <button id="prevBtn" class="btn">＜</button>
  <button id="nextBtn" class="btn">＞</button>
  <script>
    document.getElementById('navSelect').addEventListener('change', function () {
      if (this.value) location.href = this.value;
    });
  </script>
  <script type="module">
    import { shuffle } from "/sandbox/recall/main.js";
    import { createNavigator } from "/sandbox/recall/nav.js";

    // ---------- スライドデータ ----------
    const TOTAL_IMAGES = 3;
    const slides = Array.from({ length: TOTAL_IMAGES }, (_, i) => ({
      src: `images/${String(i + 1).padStart(2, '0')}.jpg`
    }));

    // ---------- ランダム化 ----------
    // 元の slides 配列は残したい場合はコピーしてからシャッフル
    const shuffledSlides = shuffle([...slides]);

    // ---------- 描画関数 ----------
    function renderImg(item, idx) {
      // 画像＋キャプションを #question に描画
      const el = document.getElementById("question");
      el.innerHTML = `<img src="${item.src}" class="slide-img">`;

      // 右上の進捗を更新
      const prog = document.getElementById("progress");
      prog.textContent = `${idx + 1} / ${slides.length}`;
    }

    // ---------- ナビゲータ作成 ----------
    const nav = createNavigator({slides :shuffledSlides, render: renderImg});

    // ボタンをナビと結び付け
    nav.bindButtons(
      document.getElementById("prevBtn"),
      document.getElementById("nextBtn")
    );

    // 初回描画
    renderImg(shuffledSlides[0], 0);
    nav.updateButtons(); 
  </script>
</body>
</html>
