<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>エクセル関数の暗記用</title>
  <link rel="icon" href="/sandbox/recall/excel/function/favicon.png">
  <link rel="apple-touch-icon" href="/sandbox/recall/excel/function/favicon.png">
  <link rel="stylesheet" href="/sandbox/recall/style.css">
</head>
<body>
  <!-- 平均表示領域（あとでスタイル調整） -->
  <!-- <div id="avgTime" style="position:absolute; top:10px; right:55px; font-size:14px;"></div> -->
  <!-- CSV の場所を data-csv に埋め込む -->
  <div id="app" data-csv="/sandbox/recall/excel/function/data.csv"></div>
  <!-- ここにテンプレートが注入される -->
  <template id="uiTemplate"></template>
  <!-- テンプレートを呼び出すのためのスクリプトを読み込む -->
  <script type="module" src="/sandbox/recall/call-tmpl_ui.js"></script>
  <!-- 主要動作を含むスクリプトを読み込む -->
  <script type="module" src="/sandbox/recall/main.js"></script>
  <!-- セレクトボックスに内部リンクを付与 -->
  <script defer src="/sandbox/recall/select.js"></script>
</body>
</html>
