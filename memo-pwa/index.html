<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memo PWA</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="appHeader">
        <button id="newBtn">新規</button>
        <input type="file" accept=".txt" id="filePicker" style="display:none;" />
        <button id="openFileBtn">ファイル選択</button>   <!-- クリックで filePicker を呼び出す -->
        <button id="saveBtn">保存</button>
        <button id="saveAsBtn">名前を付けて保存</button>
        <input type="text" id="searchInput" placeholder="検索…" />
    </header>

    <button id="toggleHeaderBtn" class="toggle-header">▲</button>
    <textarea id="editor"></textarea>
    <script src="app.js"></script>
</body>
</html>
