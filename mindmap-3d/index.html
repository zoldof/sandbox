<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindMap-3D</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f172a;
  }
  
  #3d-graph {
    width: 100vw;
    height: 100vh;
  }

  .dg-info, {
    display: none !important;
  }
  .info {
    position: fixed;
    top: 10px;
    left: 10px;
  
    color: white;
    background: rgba(0,0,0,0.4);
  
    padding: 10px;
    border-radius: 10px;
  
    z-index: 10;
    font-family: sans-serif;
    line-height: 1.5;
  }
  
</style>
</head>
<body>
  <div class="info">
    ドラッグ：回転<br>
    ホイール：ズーム<br>
    ノードクリック：注視
  </div>
  <div id="3d-graph"></div>
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.76.0/dist/3d-force-graph.min.js"></script>
  <script>
    const data = {
      nodes: [
        { id: "思考法", color: "#ff4d6d" },
        { id: "演繹", color: "#4dabf7" },
        { id: "帰納", color: "#4dabf7" },
        { id: "アブダクション", color: "#4dabf7" },
        { id: "数学", color: "#ffd43b" },
        { id: "アルゴリズム", color: "#ffd43b" },
        { id: "因果推論", color: "#69db7c" },
        { id: "システム思考", color: "#69db7c" }
      ],

      links: [
        { source: "思考法", target: "演繹" },
        { source: "思考法", target: "帰納" },
        { source: "思考法", target: "アブダクション" },
        { source: "演繹", target: "数学" },
        { source: "数学", target: "アルゴリズム" },
        { source: "帰納", target: "因果推論" },
        { source: "因果推論", target: "システム思考" }
      ]
    };

    const Graph = ForceGraph3D()
    (document.getElementById('3d-graph'))
    .graphData(data)
    .nodeLabel('id')
    .nodeAutoColorBy('color')
    .nodeColor(node => node.color)
    .nodeRelSize(6)
    .linkOpacity(0.4)
    .backgroundColor('#0f172a')
    .onNodeClick(node => {
      const distance = 120;
      const distRatio =
        1 + distance /
        Math.hypot(node.x, node.y, node.z);
      Graph.cameraPosition(
        {
          x: node.x * distRatio,
          y: node.y * distRatio,
          z: node.z * distRatio
        },
        node,
        1000
      );
    });
  </script>
</body>
</html>
