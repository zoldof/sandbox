<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindMap-3D</title>
  
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }
    
    #3d-graph {
      width: 100vw;
      height: 100vh;
    }
  
    .info {
      position: fixed;
      top: 10px;
      left: 10px;
    
      color: white;
      background: rgba(0,0,0,0.4);
    
      padding: 10px;
      border-radius: 10px;
    
      z-index: 10;
      font-family: sans-serif;
      line-height: 1.5;
    }

    .scene-nav-info {
      display: none;
    }
    
  </style>
</head>
<body>
  <div class="info">
    ドラッグ：回転<br>
    ホイール：ズーム<br>
    ノードクリック：注視
  </div>
  <div id="3d-graph"></div>
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.76.0/dist/3d-force-graph.min.js"></script>
  <script>
    const data = {
      nodes: [
        { id: "形而上学", color: "#ff4d6d" },
        { id: "哲学", color: "#4dabf7" },
        { id: "数学", color: "#ffd43b" },
        { id: "アルゴリズム", color: "#ffd43b" },
        { id: "プログラミング", color: "#69db7c" },
        { id: "エンジニアリング", color: "#69db7c" }
      ],

      links: [
        { source: "形而上学", target: "哲学" },
        { source: "哲学", target: "数学" },
        { source: "数学", target: "アルゴリズム" },
        { source: "数学", target: "プログラミング" },
        { source: "プログラミング", target: "エンジニアリング" }
      ]
    };

    const Graph = ForceGraph3D()
    (document.getElementById('3d-graph'))
    .graphData(data)
    .nodeLabel('id')
    .nodeAutoColorBy('color')
    .nodeColor(node => node.color)
    .nodeRelSize(6)
    .linkOpacity(0.4)
    .backgroundColor('#0f172a')
    .onNodeClick(node => {
      const distance = 120;
      const distRatio =
        1 + distance /
        Math.hypot(node.x, node.y, node.z);
      Graph.cameraPosition(
        {
          x: node.x * distRatio,
          y: node.y * distRatio,
          z: node.z * distRatio
        },
        node,
        1000
      );
    });
  </script>
</body>
</html>
